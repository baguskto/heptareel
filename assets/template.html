<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>heptareel · comp</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0c0e; color: #8c8c93; font: 12px/1.4 Menlo, Consolas, monospace; }
  body { display: grid; grid-template-rows: 1fr auto; place-items: center; gap: 10px; padding: 12px; box-sizing: border-box; }
  #stage { height: calc(100vh - 72px); max-width: 100%; aspect-ratio: 9 / 16; display: block; }
  #bar { display: flex; gap: 10px; align-items: center; width: min(92vw, 560px); }
  #bar input[type=range] { flex: 1; }
  #bar button { font: inherit; color: #ddd; background: #1d1d22; border: 1px solid #33333a; padding: 4px 12px; cursor: pointer; }
  .render #bar { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<div id="bar">
  <button id="play" title="space">play</button>
  <input id="scrub" type="range" min="0" max="1" step="any" value="0">
  <span id="tc">0.00s</span>
  <label title="g"><input id="guides" type="checkbox"> safe zone</label>
</div>
<script>
'use strict';
/* heptareel composition: one file, every frame is seek(t), a pure function of time.
   EDIT sections are yours to rewrite for the video. KEEP sections are the render contract
   (references/engine.md). Preview: open this file in a browser. Render: scripts/render.mjs.
   The demo below (bounce, flood, word slam) only proves the pipeline: replace it, this note and the <title>. */

/* ── EDIT · composition ───────────────────────────────────────────────── */
const COMP = {
  width: 1080, height: 1920, fps: 30,
  duration: 4.0,   // seconds, under 10
  bpm: 120,        // 1800 / bpm = frames per beat; prefer a bpm where that is a whole number
  beats: [],       // filled in the cues section: at least one entry per beat-map row -> contact sheet
  // palette: ['#0F380F', '#306230', '#8BAC0F', '#9BBC0F'],   // strict-palette styles: render.mjs check measures it
};
const SEED = 7;    // change to re-roll every random choice in the film

/* ── KEEP · helpers ───────────────────────────────────────────────────── */
const W = COMP.width, H = COMP.height, FPS = COMP.fps;
const SAFE = { top: 250, bottom: H - 400 };                       // text lives in y 250..1520
const snap = (t) => Math.round(t * FPS) / FPS;                     // event time -> exact frame time
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));               // 0 -> 1 while t goes a -> b
const stepped = (t, rate) => Math.floor(t * rate + 1e-6) / rate;   // at 30 fps: on twos 15, on threes 10
const ease = {
  inQuad: (k) => k * k,
  outQuad: (k) => 1 - (1 - k) * (1 - k),
  outCubic: (k) => 1 - (1 - k) ** 3,
  inOutCubic: (k) => (k < 0.5 ? 4 * k ** 3 : 1 - (-2 * k + 2) ** 3 / 2),
  inExpo: (k) => (k <= 0 ? 0 : 2 ** (10 * k - 10)),
  outExpo: (k) => (k >= 1 ? 1 : 1 - 2 ** (-10 * k)),
  outBack: (k, s = 1.70158) => 1 + (s + 1) * (k - 1) ** 3 + s * (k - 1) ** 2,
};
// Damped spring 0 -> 1 in closed form (no state). freq in Hz, damping 0..1 (lower = more wobble).
function spring(t, freq = 3, damping = 0.4) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI * freq, wd = w * Math.sqrt(1 - damping * damping);
  return 1 - Math.exp(-damping * w * t) * (Math.cos(wd * t) + ((damping * w) / wd) * Math.sin(wd * t));
}
// Counter-based randomness for use inside seek(): same keys -> same number, in any seek order.
// Key by element index and frame/step index, never by a running counter.
function rand(...keys) {
  let h = (2166136261 ^ SEED) | 0;
  for (const key of keys) {
    let k = Math.round(key * 4096) | 0;
    k = Math.imul(k, 0xcc9e2d51); k = (k << 15) | (k >>> 17); k = Math.imul(k, 0x1b873593);
    h ^= k; h = (h << 13) | (h >>> 19); h = (Math.imul(h, 5) + 0xe6546b64) | 0;
  }
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
// Seeded stream: only for one-time setup at load (textures, layouts, baked simulations).
function mulberry32(a) {
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Seeded 3D gradient noise in about [-1, 1]: wobble, boil, flow and curl fields.
const perlin3 = (() => {
  const rnd = mulberry32(SEED), perm = [...Array(256).keys()], p = new Uint8Array(512);
  for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  const grad = (h, x, y, z) => {
    const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z;
    return (h & 1 ? -u : u) + (h & 2 ? -v : v);
  };
  return (x, y, z = 0) => {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = fade(x), v = fade(y), w = fade(z);
    const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
    return lerp(
      lerp(lerp(grad(p[AA] & 15, x, y, z), grad(p[BA] & 15, x - 1, y, z), u),
        lerp(grad(p[AB] & 15, x, y - 1, z), grad(p[BB] & 15, x - 1, y - 1, z), u), v),
      lerp(lerp(grad(p[AA + 1] & 15, x, y, z - 1), grad(p[BA + 1] & 15, x - 1, y, z - 1), u),
        lerp(grad(p[AB + 1] & 15, x, y - 1, z - 1), grad(p[BB + 1] & 15, x - 1, y - 1, z - 1), u), v), w);
  };
})();
const hexRgb = (hex) => { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const rgba = (hex, a) => `rgba(${hexRgb(hex).join(',')},${a})`;
// Text that isn't drawn with fillText on the stage (bitmap fonts, stroked paths, particles, offscreen
// canvases) is invisible to render.mjs check. Call this from seek() with its stage-space box so the
// safe-zone and size checks still see it. No effect outside `check`.
function markText(text, x, y, w, h) {
  const P = window.__hrProbe;
  if (P && P.inSeek) P.texts.push({ text: String(text).slice(0, 40), top: y, bottom: y + h, size: h });
}

/* ── KEEP · stage ─────────────────────────────────────────────────────── */
const stage = document.getElementById('stage');
const ctx = stage.getContext('2d', { alpha: false });   // opaque: every frame paints its own background

/* ── EDIT · look ──────────────────────────────────────────────────────── */
const PAL = { ink: '#111116', paper: '#EFEBE4', red: '#FF3319' };   // every colour in the film comes from here
const SANS = '"Arial Black", "Helvetica Neue", Arial, sans-serif';
const MONO = 'Menlo, "DejaVu Sans Mono", Consolas, monospace';

/* ── EDIT · cues ──────────────────────────────────────────────────────── */
// Every timed event lives here. Scenes AND the score read these numbers, so each hit lands on its frame.
const GROUND = 1240, DROP = 420, R = 56, E = 0.5, FIRST_HIT = 0.5;      // closed-form bounce, no simulation
const GRAV = (2 * (GROUND - R - DROP)) / FIRST_HIT ** 2;
const HITS = [FIRST_HIT];
for (let i = 1, v = GRAV * FIRST_HIT * E; i < 3; i++, v *= E) HITS.push(HITS[i - 1] + (2 * v) / GRAV);

const CUE = {
  hits: HITS.map(snap),               // three wooden thuds
  flood: snap(HITS[2] + 0.2),         // the ball swells to fill the frame
  word: snap(HITS[2] + 0.55),         // first letter slams in
  caption: snap(3.0),                 // caption types on
};
CUE.letters = [...'REEL'].map((_, i) => snap(CUE.word + (i * 4) / FPS));   // one letter every 4 frames

COMP.beats = [
  { t: snap(0.25), label: 'drop' },
  { t: CUE.hits[0], label: 'first bounce' },
  { t: snap(CUE.flood + 0.15), label: 'flood' },
  { t: snap(CUE.letters[3] + 3 / FPS), label: 'word landed' },
  { t: snap(3.5), label: 'hold' },
];

/* ── EDIT · scenes ────────────────────────────────────────────────────── */
function ballY(t) {                                   // ball centre for any t
  if (t < HITS[0]) return DROP + 0.5 * GRAV * t * t;
  for (let i = 1, v = GRAV * FIRST_HIT * E; i < HITS.length; i++, v *= E) {
    if (t < HITS[i]) { const d = t - HITS[i - 1]; return GROUND - R - (v * d - 0.5 * GRAV * d * d); }
  }
  return GROUND - R;
}
function squash(t) {                                  // 0..1, peaks on impact frames, later bounces softer
  let s = 0;
  HITS.forEach((h, i) => {
    const d = t - h;
    if (d > -0.03 && d < 0.15) s = Math.max(s, (1 - i * 0.3) * (d < 0 ? 1 + d / 0.03 : Math.exp(-d / 0.03)));
  });
  return s;
}

function sceneBounce(c, lt, t) {
  c.fillStyle = PAL.ink; c.fillRect(0, 0, W, H);
  c.fillStyle = PAL.paper; c.fillRect(140, GROUND, W - 280, 4);
  const s = squash(t);
  c.translate(W / 2, ballY(t) + R * 0.4 * s);         // keep the squashed ball on the ground
  c.scale(1 + 0.45 * s, 1 - 0.4 * s);
  c.fillStyle = PAL.red; c.beginPath(); c.arc(0, 0, R, 0, Math.PI * 2); c.fill();
}

function sceneFlood(c, lt) {
  c.fillStyle = PAL.ink; c.fillRect(0, 0, W, H);
  const k = ease.inExpo(prog(lt, 0, CUE.word - CUE.flood - 0.1));
  c.fillStyle = PAL.red; c.beginPath(); c.arc(W / 2, GROUND - R, lerp(R, Math.hypot(W, H), k), 0, Math.PI * 2); c.fill();
}

function sceneWord(c, lt, t) {
  c.fillStyle = PAL.red; c.fillRect(0, 0, W, H);
  c.fillStyle = PAL.ink; c.textAlign = 'center';
  const word = [...'REEL'];
  c.font = `900 300px ${SANS}`;
  const widths = word.map((ch) => c.measureText(ch).width), total = widths.reduce((a, b) => a + b, 0);
  let x = (W - total) / 2;
  word.forEach((ch, i) => {
    if (t >= CUE.letters[i]) {
      const s = lerp(1.7, 1, ease.outCubic(prog(t, CUE.letters[i], CUE.letters[i] + 3 / FPS)));   // 3-frame slam
      c.save(); c.translate(x + widths[i] / 2, 1080); c.scale(s, s); c.fillText(ch, 0, 0); c.restore();
    }
    x += widths[i];
  });
  const cap = 'MADE WITH HEPTAREEL', n = Math.floor(clamp((t - CUE.caption) * FPS, 0, cap.length));   // a letter per frame
  if (n > 0) { c.font = `600 40px ${MONO}`; c.fillText(cap.slice(0, n), W / 2, 1220); }
}

// Hard cuts only: each scene owns [from, to) and seek(t) paints exactly one scene per frame.
const SCENES = [
  { from: 0, to: CUE.flood, draw: sceneBounce },
  { from: CUE.flood, to: CUE.word, draw: sceneFlood },
  { from: CUE.word, to: Infinity, draw: sceneWord },
];

/* ── EDIT · score ─────────────────────────────────────────────────────── */
// music and sfx are the same instrument kit on two buses (audio engine below). Times come from CUE so
// every hit lands on its frame. Silence or duck the music by automating musicBus.gain at CUE times.
function score({ music, sfx, musicBus }) {
  const beat = 60 / COMP.bpm;
  CUE.hits.forEach((t, i) => sfx.thud(t, 0.9 - i * 0.25));
  sfx.riser(CUE.flood, CUE.word - CUE.flood, 0.25);
  sfx.impact(CUE.word, 0.9);
  CUE.letters.forEach((t) => sfx.click(t, 0.45));
  const roots = [55, 55, 65.41, 49];
  for (let i = 0, t = CUE.word; t < COMP.duration - 0.1; i++, t = snap(CUE.word + i * beat)) {
    if (i) music.kick(t, 0.75);
    music.hat(snap(t + beat / 2), 0.18);
    music.bass(t, roots[i % 4], beat * 0.9, 0.4);
  }
  sfx.bell(CUE.caption, 880, 0.22);
  sfx.bell(CUE.caption, 1318.5, 0.12);
  musicBus.gain.setValueAtTime(0.6, CUE.caption);                            // duck under the caption bell
  musicBus.gain.linearRampToValueAtTime(0.35, CUE.caption + 0.05);
  musicBus.gain.linearRampToValueAtTime(0.6, CUE.caption + 0.6);
}

/* ── KEEP · seek(t) ───────────────────────────────────────────────────── */
function seek(t) {
  t = clamp(t, 0, COMP.duration);
  if (ctx.reset) ctx.reset();                         // drop every bit of canvas state from the last frame
  else {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.filter = 'none'; ctx.setLineDash([]); ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic'; ctx.imageSmoothingEnabled = true;
  }
  const scene = SCENES.find((s) => t >= s.from && t < s.to) || SCENES[SCENES.length - 1];
  ctx.save();
  scene.draw(ctx, t - scene.from, t);
  ctx.restore();
}

/* ── KEEP · audio engine ──────────────────────────────────────────────── */
// Deterministic: OfflineAudioContext + seeded noise. render.mjs normalizes to -14 LUFS afterwards,
// so mix for balance, not loudness. More instruments and foley: references/sound.md.
async function renderAudio() {
  const SR = 48000, ac = new OfflineAudioContext(2, Math.ceil(COMP.duration * SR), SR);
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 3; comp.attack.value = 0.003; comp.release.value = 0.2;
  const master = ac.createGain();
  master.gain.value = 0.8;
  master.connect(comp).connect(ac.destination);
  // Two buses so the music can be ducked or silenced (a real "beat of silence") while hits keep playing.
  const musicBus = ac.createGain(), sfxBus = ac.createGain();
  musicBus.gain.value = 0.6; sfxBus.gain.value = 0.9;
  musicBus.connect(master); sfxBus.connect(master);
  score({ music: makeKit(ac, musicBus, 1), sfx: makeKit(ac, sfxBus, 2), musicBus, sfxBus });
  return ac.startRendering();
}

function makeKit(ac, out, salt = 1) {
  const sr = ac.sampleRate, rnd = mulberry32(SEED * 7919 + salt);
  const noise = ac.createBuffer(1, sr * 2, sr);
  { const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1; }
  const verb = ac.createConvolver();                  // generated room: exponentially decaying noise
  {
    const len = Math.floor(sr * 2.2), ir = ac.createBuffer(2, len, sr);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (rnd() * 2 - 1) * (1 - i / len) ** 3; }
    verb.buffer = ir;
    const wet = ac.createGain(); wet.gain.value = 0.3; verb.connect(wet).connect(out);
  }
  const gain = (t, peak, attack, decay, dest = out) => {
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(1e-4, t + attack + decay);
    g.connect(dest);
    return g;
  };
  const tone = (type, f, t, dur, dest) => {
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
    o.connect(dest); o.start(t); o.stop(t + dur + 0.05); return o;
  };
  const hiss = (t, dur, dest) => {
    const s = ac.createBufferSource(); s.buffer = noise; s.loop = true;
    s.connect(dest); s.start(t, rnd() * 1.5); s.stop(t + dur + 0.05); return s;
  };
  const filter = (type, f, q, dest) => {
    const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; b.connect(dest); return b;
  };
  const waves = {};
  const kit = {
    ac, out, verb, rnd, noise, gain, tone, hiss, filter,
    kick(t, v = 0.9) { const o = tone('sine', 150, t, 0.45, gain(t, v, 0.002, 0.38)); o.frequency.exponentialRampToValueAtTime(45, t + 0.12); },
    snare(t, v = 0.5) { hiss(t, 0.22, filter('bandpass', 1900, 0.9, gain(t, v, 0.001, 0.18))); tone('triangle', 190, t, 0.12, gain(t, v * 0.5, 0.001, 0.08)); },
    hat(t, v = 0.2, open = false) { hiss(t, open ? 0.3 : 0.06, filter('highpass', 7500, 0.8, gain(t, v, 0.001, open ? 0.25 : 0.045))); },
    click(t, v = 0.4) { hiss(t, 0.02, filter('highpass', 2500, 0.7, gain(t, v, 0.0005, 0.012))); },
    thud(t, v = 0.8) {   // wooden thud: short pitch-dropping sine + a puff of low noise
      const o = tone('sine', 210, t, 0.25, gain(t, v, 0.001, 0.18)); o.frequency.exponentialRampToValueAtTime(70, t + 0.09);
      hiss(t, 0.08, filter('lowpass', 1100, 0.7, gain(t, v * 0.4, 0.001, 0.05)));
    },
    blip(t, f = 880, v = 0.25, dur = 0.08, type = 'square') { tone(type, f, t, dur, gain(t, v, 0.002, dur)); },
    bass(t, f, dur = 0.4, v = 0.4) { const g = gain(t, v, 0.006, dur); tone('sawtooth', f, t, dur, filter('lowpass', 480, 1.1, g)); tone('sine', f, t, dur, g); },
    bell(t, f, v = 0.2, dur = 1.6) { [1, 2.76, 5.4].forEach((m, i) => tone('sine', f * m, t, dur, gain(t, v / (1 + i * 1.6), 0.002, dur / (1 + i)))); },
    pluck(t, f, v = 0.4, dur = 1.5) {   // Karplus-Strong string: lute, harpsichord, plucked bass
      const n = Math.ceil(sr * dur), b = ac.createBuffer(1, n, sr), d = b.getChannelData(0);
      const p = Math.max(2, Math.round(sr / f - 0.5)), line = new Float32Array(p), loss = 0.001 ** (1 / (dur * f));
      for (let i = 0; i < p; i++) line[i] = rnd() * 2 - 1;
      for (let i = 0, j = 0; i < n; i++, j = (j + 1) % p) { d[i] = line[j]; line[j] = 0.5 * (line[j] + line[(j + 1) % p]) * loss; }
      const s = ac.createBufferSource(); s.buffer = b;
      const g = ac.createGain(); g.gain.value = v;
      s.connect(g).connect(out); s.start(t);
    },
    riser(t, dur = 0.8, v = 0.25) {
      const g = ac.createGain();
      g.gain.setValueAtTime(1e-4, t); g.gain.exponentialRampToValueAtTime(v, t + dur); g.gain.setValueAtTime(0, t + dur);
      g.connect(out);
      const bp = filter('bandpass', 300, 1.6, g);
      bp.frequency.setValueAtTime(300, t); bp.frequency.exponentialRampToValueAtTime(6000, t + dur);
      hiss(t, dur, bp);
    },
    impact(t, v = 1) {
      kit.kick(t, v);
      const o = tone('sine', 80, t, 1.4, gain(t, v * 0.7, 0.002, 1.2)); o.frequency.exponentialRampToValueAtTime(32, t + 1.0);
      hiss(t, 0.5, filter('lowpass', 2600, 0.6, gain(t, v * 0.45, 0.001, 0.35, verb)));
    },
    // Chiptune voices. Hard-edged waves ring after AAC encoding, so they go through an 8 kHz lowpass.
    pulse(t, f, dur = 0.12, v = 0.2, duty = 0.25) {      // Game Boy / NES pulse; duty 0.125, 0.25 or 0.5
      waves[duty] = waves[duty] || (() => {
        const n = 48, re = new Float32Array(n), im = new Float32Array(n);
        for (let k = 1; k < n; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
        return ac.createPeriodicWave(re, im);
      })();
      const o = ac.createOscillator(); o.setPeriodicWave(waves[duty]); o.frequency.setValueAtTime(f, t);
      o.connect(filter('lowpass', 8000, 0.7, gain(t, v, 0.002, dur))); o.start(t); o.stop(t + dur + 0.05);
      return o;
    },
    tri(t, f, dur = 0.2, v = 0.3) { tone('triangle', f, t, dur, gain(t, v, 0.002, dur)); },
    chipNoise(t, dur = 0.12, v = 0.25, hold = 16) {      // sample-and-hold noise channel: longer hold = lower, crunchier
      const n = Math.ceil(sr * dur), b = ac.createBuffer(1, n, sr), d = b.getChannelData(0);
      for (let i = 0, x = 0; i < n; i++) { if (i % hold === 0) x = rnd() < 0.5 ? -1 : 1; d[i] = x; }
      const s = ac.createBufferSource(); s.buffer = b;
      s.connect(filter('lowpass', 8000, 0.7, gain(t, v, 0.001, dur))); s.start(t);
    },
    crush(t, dur = 0.45, v = 0.3) {                      // bitcrushed burst: 4-bit levels, each held 8 samples
      const n = Math.ceil(sr * dur), b = ac.createBuffer(1, n, sr), d = b.getChannelData(0);
      for (let i = 0, x = 0; i < n; i++) {
        if (i % 8 === 0) x = Math.round((Math.sin((i / sr) * 2 * Math.PI * 110 * (1 + i / n)) + (rnd() * 2 - 1) * 0.6) * 7) / 7;
        d[i] = x * (1 - i / n);
      }
      const s = ac.createBufferSource(); s.buffer = b;
      const g = ac.createGain(); g.gain.value = v;
      s.connect(filter('lowpass', 7500, 0.7, g)); s.start(t);
    },
    arp(t, root, semis, step, v = 0.16, duty = 0.25) { semis.forEach((n, i) => kit.pulse(t + i * step, root * 2 ** (n / 12), step * 0.9, v, duty)); },
    coin(t, v = 0.2) { kit.pulse(t, 987.77, 0.08, v, 0.5); kit.pulse(t + 0.08, 1318.51, 0.45, v, 0.5); },
    boing(t, v = 0.3) {
      const o = tone('sine', 180, t, 0.32, gain(t, v, 0.003, 0.3));
      o.frequency.exponentialRampToValueAtTime(520, t + 0.08); o.frequency.exponentialRampToValueAtTime(300, t + 0.3);
    },
  };
  return kit;
}

/* ── KEEP · contract + preview player ─────────────────────────────────── */
window.COMP = COMP;
window.seek = seek;
window.renderAudio = renderAudio;
window.ready = (async () => {
  await document.fonts.ready;   // for @font-face fonts also: await document.fonts.load('900 300px "Your Font"')
  // bake textures and simulations here (references/engine.md, "Stateful systems")
})();

if (window.__HEPTAREEL_RENDER__) document.documentElement.classList.add('render');
else window.ready.then(() => {
  const $ = (id) => document.getElementById(id);
  const playBtn = $('play'), scrub = $('scrub'), tc = $('tc'), guides = $('guides');
  const last = COMP.duration - 1 / FPS;
  let ac = null, buffer = null, src = null, playing = false, origin = 0;
  let pos = clamp(Number(new URLSearchParams(location.search).get('t')) || 0, 0, last);
  const show = (t) => {
    seek(t);
    if (guides.checked) {   // preview only: the render never sees these bands
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(255,40,40,0.22)'; ctx.fillRect(0, 0, W, SAFE.top); ctx.fillRect(0, SAFE.bottom, W, H - SAFE.bottom);
      ctx.restore();
    }
    scrub.value = t / COMP.duration;
    tc.textContent = `${t.toFixed(2)}s · f${Math.round(t * FPS)}`;
  };
  const clock = () => (playing ? ac.currentTime - origin : pos);
  async function play() {
    ac = ac || new AudioContext();
    if (!buffer) buffer = await renderAudio();
    if (pos >= last) pos = 0;
    src = ac.createBufferSource(); src.buffer = buffer; src.connect(ac.destination); src.start(0, pos);
    origin = ac.currentTime - pos; playing = true; playBtn.textContent = 'pause';
    requestAnimationFrame(tick);
  }
  function pause() {
    if (!playing) return;
    pos = Math.min(clock(), last); src.stop(); playing = false; playBtn.textContent = 'play'; show(pos);
  }
  function tick() {
    if (!playing) return;
    const t = clock();
    if (t >= COMP.duration) { pause(); pos = 0; play(); return; }   // loops
    show(t);
    requestAnimationFrame(tick);
  }
  playBtn.onclick = () => (playing ? pause() : play());
  scrub.oninput = () => { pause(); pos = Math.min(Number(scrub.value) * COMP.duration, last); show(pos); };
  guides.onchange = () => show(clock());
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); if (playing) pause(); else play(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      pause();
      pos = clamp(snap(pos) + (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 1 : 1 / FPS), 0, last);
      show(pos);
    } else if (e.key === 'g') { guides.checked = !guides.checked; show(clock()); }
  });
  show(pos);
});
</script>
